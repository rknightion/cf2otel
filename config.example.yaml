# Secrets are environment-only: CF2OTEL_CLOUDFLARE__API_TOKEN and
# CF2OTEL_OTLP__GRAFANA_CLOUD__TOKEN.
prometheus:
  enabled: false # Scheduled mode only; OTLP remains required and active.
  listen: 127.0.0.1:9465 # Unauthenticated /metrics; restrict access before widening.
cloudflare:
  account_id: ""
  zones: []
  api_base: https://api.cloudflare.com/client/v4
  timeout: 30s
  max_response_bytes: 16777216
  entitlement_backoff: 1h # Positive duration; retry disabled/absent zone datasets.
  rate_limit:
    max_pause: 5m # REST header pause ceiling; duration in [1s, 60m].
    rest:
      requests_per_second: 1.25 # rest + graphql should stay within Cloudflare's 4 rps general limit.
      burst: 5 # Integer in [1, 1000].
    graphql:
      requests_per_second: 2.5 # Process-wide GraphQL cap.
      burst: 5 # Integer in [1, 1000].
    account_based: true # Send X-Rate-Limit-Type: account-based; meter GraphQL per zone and account.
    graphql_scope:
      requests_per_second: 0.9 # Per zone or account; Cloudflare allows 1 rps each.
      burst: 2 # Integer in [1, 1000].
# Independent public status API; never receives the Cloudflare token.
statuspage:
  base_url: https://www.cloudflarestatus.com
  timeout: 15s
  max_response_bytes: 2097152
  component_cap: 500
access:
  include_service_tokens: false
http:
  request_source: eyeball # Groups metrics only: eyeball or all; never filters raw events.
  breakdowns: [status, origin_status, country, protocol, tls_protocol, method, content_type]
  scope: access_protected
  metrics_scope: "" # Inherit http.scope; set to all to include every account zone in metrics only.
  hosts: []
  zones: []
  max_metric_hosts_per_zone: 1000
  max_metric_series_per_window: 10000
  # Opt in by adding colo, asn or error_path to breakdowns; default features stay unchanged.
  high_cardinality_limit: 500 # Normal groups per metric/zone, plus at most one remainder.
  high_cardinality_hosts: [] # Exact lowercase bare DNS names; only these new features.
  error_path_routes: null # Safe name -> canonical template, e.g. item: /items/:number.
firewall:
  rule_dimensions: false # Opt in to rule ID/description, host and country metrics when advertised.
  max_metric_series_per_window: 500 # Positive total cap, including the all-other remainder.
dex:
  result_window: 1h # Current provider averages; valid 1h..168h, no backfill checkpoint.
  max_tests: 1000 # Complete catalog required; valid 1..10000.
  max_metric_series: 500 # Total lifetime identities; six slots reserved for kind/signal remainders.
warp:
  last_seen_window: 15m
  max_metric_series: 500
platform:
  max_metric_series_per_window: 500
identity:
  enabled: true
  match_window: 15m
  max_candidates: 100000
ai_gateway:
  gateways: []
  capture_bodies: false
  max_body_bytes: 16384
  link_caller_traces: true
otlp:
  metric_denylist: [] # Exact internal/semconv metric names, before Prometheus translation.
  attribute_denylist: [] # Exact semantic keys on signals, not resource attributes or bodies.
  metric_cardinality_limit: 10000 # Nonnegative; 0 disables the SDK cardinality limit.
  endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
  protocol: http
  grafana_cloud:
    instance_id: ""
  headers: {}
state:
  dir: /var/lib/cf2otel
health:
  listen: 127.0.0.1:9464
log:
  level: info
  format: json

# Collector names are fixed by the domain registry. AI Gateway metrics come
# from aigateway.logs while GraphQL Groups ingestion lag remains unbounded.
collectors:
  loadbalancers.health: # Fixture-only unattributed provider flag, not regional pool availability.
    enabled: false
    interval: 5m
  dex.tests: # Fixture-only DEX result snapshots; explicit opt-in to bounded test-name labels.
    enabled: false
    interval: 5m
  statuspage.components: # Current snapshot, expiry after three poll intervals; no checkpoint.
    enabled: false
    interval: 5m
  statuspage.incidents: # Latest 50 incidents only, including resolved updates.
    enabled: false
    interval: 5m
    initial_lookback: 15m
    max_window: 1h
  access.logins:
    enabled: true
  access.login_metrics:
    enabled: true
  access.scim:
    enabled: true
  access.seats: # Independent user seat flags; not an additive billing-user total.
    enabled: true
    interval: 15m
  inventory.access:
    enabled: true
  httpreq.events:
    enabled: true
  httpreq.metrics:
    enabled: true
  httpreq.threats: # Complete UTC-hour rollups, at least 10m holdback.
    enabled: true
    interval: 1h
    initial_lookback: 1h
    max_window: 1h
  httpreq.transfer: # Account eyeball-only MTD snapshot, no checkpoint.
    enabled: true
    interval: 1h
    initial_lookback: 0s
    max_window: 0s
  aigateway.logs:
    enabled: true
  aigateway.metrics:
    enabled: false
  aigateway.coverage:
    enabled: false
  audit.logs:
    enabled: true
  firewall.events:
    enabled: true
  firewall.metrics:
    enabled: true
  dns.events:
    enabled: true
  dns.metrics:
    enabled: true
  rum.pageloads:
    enabled: true
  rum.web_vitals:
    enabled: true
  gateway.dns:
    enabled: true
  workers.overview:
    enabled: true
  workers.invocations:
    enabled: true
    interval: 5m
  turnstile.events:
    enabled: true
  logpush.health:
    enabled: true
  logpush.failures: # Explicit opt-in to bounded job-ID labels.
    enabled: false
    interval: 5m
    initial_lookback: 30m
    max_window: 1h
  healthchecks.events: # Pro-only; explicit opt-in to bounded origin labels.
    enabled: false
    interval: 5m
    initial_lookback: 30m
    max_window: 1h
  d1.analytics:
    enabled: true
  d1.queries:
    enabled: true
  d1.storage:
    enabled: true
  kv.operations:
    enabled: true
  kv.storage:
    enabled: true
  r2.bandwidth:
    enabled: true
  r2.catalog_data:
    enabled: true
  r2.catalog_maintenance:
    enabled: true
  r2.operations:
    enabled: true
  r2.storage:
    enabled: true
  r2.sql:
    enabled: true
  durableobjects.invocations:
    enabled: true
  durableobjects.periodic:
    enabled: true
  durableobjects.sql_storage:
    enabled: true
  durableobjects.subrequests:
    enabled: true
  queues.backlog:
    enabled: true
  queues.consumer:
    enabled: true
  queues.delayed_backlog:
    enabled: true
  queues.message_operations:
    enabled: true
  email.routing:
    enabled: true
  email.sending:
    enabled: true
  selfobs:
    enabled: true
  certs.packs: # Requires SSL and Certificates Read; snapshot, no checkpoint key.
    enabled: false
    interval: 1h
  warp.fleet: # Doc-derived recently seen fleet; account DEX Read preferred.
    enabled: false
    interval: 5m
  tunnels.status: # Requires Cloudflare Tunnel Read; snapshot, no checkpoint key.
    enabled: false
    interval: 1m
  workersai.metrics: # Account aggregate Groups; complete five-minute buckets, 10m holdback.
    enabled: false
    interval: 5m
    initial_lookback: 30m
    max_window: 1h
