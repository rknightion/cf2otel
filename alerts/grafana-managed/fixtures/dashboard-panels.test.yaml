{
  "evaluation_interval": "1m",
  "rule_files": [],
  "tests": [
    {
      "input_series": [
        {
          "series": "cf2otel_zones_discovered{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "8+0x5"
        },
        {
          "series": "cf2otel_zones_discovered{service_name=\"cf2otel\",instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "8+0x5"
        },
        {
          "series": "cf2otel_zones_discovered{service_name=\"cf2otel\",instance=\"old-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "8+0x5"
        },
        {
          "series": "cf2otel_zones_filtered{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"exclude\"}",
          "values": "2+0x5"
        },
        {
          "series": "cf2otel_zones_filtered{service_name=\"cf2otel\",instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"exclude\"}",
          "values": "2+0x5"
        },
        {
          "series": "cf2otel_zones_filtered{service_name=\"cf2otel\",instance=\"old-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"exclude\"}",
          "values": "2+0x5"
        },
        {
          "series": "cf2otel_zones_processed{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "6+0x5"
        },
        {
          "series": "cf2otel_zones_processed{service_name=\"cf2otel\",instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "6+0x5"
        },
        {
          "series": "cf2otel_zones_processed{service_name=\"cf2otel\",instance=\"old-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "6+0x5"
        },
        {
          "series": "cf2otel_zones_skipped{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"unentitled\"}",
          "values": "0+0x5"
        },
        {
          "series": "cf2otel_zones_skipped{service_name=\"cf2otel\",instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"unentitled\"}",
          "values": "0+0x5"
        },
        {
          "series": "cf2otel_zones_skipped{service_name=\"cf2otel\",instance=\"old-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"unentitled\"}",
          "values": "0+0x5"
        },
        {
          "series": "cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "300+0x5"
        },
        {
          "series": "cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\",instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "300+0x5"
        },
        {
          "series": "cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\",instance=\"old-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "-900+0x5"
        },
        {
          "series": "cf2otel_zones_discovered{service_name=\"cf2otel\",instance=\"unknown-fixture\",cf2otel_collector=\"fixture-collector\"}",
          "values": "99+0x5"
        }
      ],
      "interval": "1m",
      "name": "zone gauges preserve reasons zero and independent fresh instances",
      "promql_expr_test": [
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\"}",
              "value": 8
            },
            {
              "labels": "{instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\"}",
              "value": 8
            }
          ],
          "expr": "max by (instance, cf2otel_collector, cf2otel_zone_reason) (cf2otel_zones_discovered{service_name=\"cf2otel\"}) and on (instance, cf2otel_collector) (time() - max by (instance, cf2otel_collector) (cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\"}) < 900)"
        },
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"exclude\"}",
              "value": 2
            },
            {
              "labels": "{instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"exclude\"}",
              "value": 2
            }
          ],
          "expr": "max by (instance, cf2otel_collector, cf2otel_zone_reason) (cf2otel_zones_filtered{service_name=\"cf2otel\"}) and on (instance, cf2otel_collector) (time() - max by (instance, cf2otel_collector) (cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\"}) < 900)"
        },
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\"}",
              "value": 6
            },
            {
              "labels": "{instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\"}",
              "value": 6
            }
          ],
          "expr": "max by (instance, cf2otel_collector, cf2otel_zone_reason) (cf2otel_zones_processed{service_name=\"cf2otel\"}) and on (instance, cf2otel_collector) (time() - max by (instance, cf2otel_collector) (cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\"}) < 900)"
        },
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"unentitled\"}",
              "value": 0
            },
            {
              "labels": "{instance=\"replica-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_zone_reason=\"unentitled\"}",
              "value": 0
            }
          ],
          "expr": "max by (instance, cf2otel_collector, cf2otel_zone_reason) (cf2otel_zones_skipped{service_name=\"cf2otel\"}) and on (instance, cf2otel_collector) (time() - max by (instance, cf2otel_collector) (cf2otel_scrape_last_success_timestamp_seconds{service_name=\"cf2otel\"}) < 900)"
        }
      ]
    },
    {
      "input_series": [
        {
          "series": "cf2otel_scrape_errors_total{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"auth\"}",
          "values": "0+1x5"
        },
        {
          "series": "cf2otel_scrape_errors_total{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"timeout\"}",
          "values": "0+2x5"
        },
        {
          "series": "cf2otel_scrape_errors_total{service_name=\"cf2otel\",instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"other\"}",
          "values": "0+0x5"
        }
      ],
      "interval": "1m",
      "name": "error classes remain independent including seeded zero",
      "promql_expr_test": [
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"auth\"}",
              "value": 5
            },
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"timeout\"}",
              "value": 10
            },
            {
              "labels": "{instance=\"fresh-fixture\",cf2otel_collector=\"fixture-collector\",cf2otel_error_class=\"other\"}",
              "value": 0
            }
          ],
          "expr": "sum by (instance, cf2otel_collector, cf2otel_error_class) (increase(cf2otel_scrape_errors_total{service_name=\"cf2otel\"}[5m]))"
        }
      ]
    },
    {
      "input_series": [],
      "interval": "1m",
      "name": "absent never incremented errors are not manufactured",
      "promql_expr_test": [
        {
          "eval_time": "5m",
          "exp_samples": [],
          "expr": "sum by (instance, cf2otel_collector, cf2otel_error_class) (increase(cf2otel_scrape_errors_total{service_name=\"cf2otel\"}[5m]))"
        }
      ]
    },
    {
      "input_series": [
        {
          "series": "cloudflare_firewall_events_total{service_name=\"cf2otel\",instance=\"fresh-fixture\",cloudflare_firewall_zone=\"fixture-zone\",cloudflare_firewall_rule_id=\"fixture-rule\",cloudflare_firewall_rule_description=\"Fixture rule\",cloudflare_firewall_host=\"fixture-host\",cloudflare_firewall_client_country=\"GB\",cloudflare_firewall_action=\"block\",cloudflare_firewall_source=\"fixture-engine\"}",
          "values": "0+2x5"
        },
        {
          "series": "cloudflare_firewall_events_total{service_name=\"cf2otel\",instance=\"fresh-fixture\",cloudflare_firewall_zone=\"fixture-fallback\"}",
          "values": "0+1x5"
        }
      ],
      "interval": "1m",
      "name": "firewall metric retains enrichment and unadvertised fallback",
      "promql_expr_test": [
        {
          "eval_time": "5m",
          "exp_samples": [
            {
              "labels": "{instance=\"fresh-fixture\",cloudflare_firewall_zone=\"fixture-zone\",cloudflare_firewall_rule_id=\"fixture-rule\",cloudflare_firewall_rule_description=\"Fixture rule\",cloudflare_firewall_host=\"fixture-host\",cloudflare_firewall_client_country=\"GB\",cloudflare_firewall_action=\"block\",cloudflare_firewall_source=\"fixture-engine\"}",
              "value": 10
            },
            {
              "labels": "{instance=\"fresh-fixture\",cloudflare_firewall_zone=\"fixture-fallback\"}",
              "value": 5
            }
          ],
          "expr": "sum by (instance, cloudflare_firewall_zone, cloudflare_firewall_rule_id, cloudflare_firewall_rule_description, cloudflare_firewall_host, cloudflare_firewall_client_country, cloudflare_firewall_action, cloudflare_firewall_source) (increase(cloudflare_firewall_events_total{service_name=\"cf2otel\",cloudflare_firewall_zone=~\".*\"}[5m]))"
        }
      ]
    }
  ]
}
