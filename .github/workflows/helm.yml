name: Helm
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
permissions:
  contents: read
concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@d5995d27ca2ffc697f06e312c69541b149ab2fd7 # v1.25.27
    with:
      chart-path: charts/cf2otel
      kubernetes-versions: "1.29.0"
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
