name: Helm
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
permissions:
  contents: read
concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@40b04a8393537f0aaf610e9286a5d4af44f98455 # v1.32.2
    with:
      chart-path: charts/cf2otel
      kubernetes-versions: "1.29.0"
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
