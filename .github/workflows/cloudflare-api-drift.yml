name: Cloudflare API drift

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-drift
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read schema probe token
        uses: rknightion/.github/.github/actions/bao-secret@26a39c358af3086bddffaeb336fa1d4481db8eb5 # v1.30.18
        with:
          role: rknightion-cf2otel
          path: rknightion/cf2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}
      - name: Check API contract
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?missing Cloudflare token}"
          go run ./tools/apidrift -spec spec/cloudflare/contract.json
