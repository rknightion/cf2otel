name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance evidence check runs in pr-metadata.yml, so editing a pull request body does not
    # re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    name: build / vet / test
    needs: backlog-freeze
    if: >-
      ${{
        !cancelled() && (github.event_name != 'pull_request' ||
          needs.backlog-freeze.result != 'success' ||
          needs.backlog-freeze.outputs.build-test != 'readme-only')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just check </dev/null

  groma-check:
    name: architecture map is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Go scanner loads packages through the Go toolchain.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just groma-check </dev/null

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"
      - run: just vuln </dev/null

  goreleaser-snapshot:
    name: goreleaser build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --snapshot --clean --skip=publish,sign,sbom,docker

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: cf2otel:ci
          # Read the amd64 cache written by the image publish workflow.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-linux-amd64
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. The reusable fails on any event but pull_request. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-test: ${{ steps.paths.outputs.build-test }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

      - name: Classify the exact tree for the Go gate
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha='^[a-f0-9]{40}$'
          readme_entry=$'^100644 blob ([a-f0-9]{40})\tREADME\\.md$'
          export GIT_TERMINAL_PROMPT=0
          readme_only() (
            [[ "$CHANGED_FILES" == 1 && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "$BASE_SHA" =~ $sha && "$HEAD_SHA" =~ $sha && "$MERGE_SHA" =~ $sha ]] || return 1
            candidate="$(timeout 10s gh api "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=2" \
              --jq 'select(length == 1) | .[0] | select(.filename == "README.md" and .status == "modified" and .previous_filename == null) | .filename')" || return 1
            [[ "$candidate" == README.md ]] || return 1
            scratch="$(mktemp -d)" || return 1
            trap 'rm -rf -- "$scratch"' EXIT
            git -C "$scratch" init --bare --quiet || return 1
            timeout 15s git -C "$scratch" -c credential.helper= fetch --quiet --no-tags --filter=blob:none \
              "${GITHUB_SERVER_URL}/${REPO}.git" "$MERGE_SHA" || return 1
            [[ "$(git -C "$scratch" rev-parse FETCH_HEAD)" == "$MERGE_SHA" ]] || return 1
            [[ "$(git -C "$scratch" show -s --format=%P "$MERGE_SHA")" == "$BASE_SHA $HEAD_SHA" ]] || return 1
            [[ "$(git -C "$scratch" rev-parse --is-shallow-repository)" == false ]] || return 1
            fork_point="$(git -C "$scratch" merge-base --all "$BASE_SHA" "$HEAD_SHA")" || return 1
            [[ "$fork_point" =~ $sha ]] || return 1

            base_readme="$(git -C "$scratch" ls-tree "$BASE_SHA" -- README.md)" || return 1
            fork_readme="$(git -C "$scratch" ls-tree "$fork_point" -- README.md)" || return 1
            head_readme="$(git -C "$scratch" ls-tree "$HEAD_SHA" -- README.md)" || return 1
            merge_readme="$(git -C "$scratch" ls-tree "$MERGE_SHA" -- README.md)" || return 1
            [[ "$base_readme" =~ $readme_entry && "$fork_readme" =~ $readme_entry && "$head_readme" =~ $readme_entry ]] || return 1
            [[ "$base_readme" != "$merge_readme" && "$fork_readme" != "$head_readme" && "$head_readme" == "$merge_readme" ]] || return 1
            git -C "$scratch" diff-tree --quiet -r --no-ext-diff --no-textconv --no-renames \
              --ignore-submodules=none "$fork_point" "$HEAD_SHA" -- ':(top,literal,exclude)README.md' || return 1
            git -C "$scratch" diff-tree --quiet -r --no-ext-diff --no-textconv --no-renames \
              --ignore-submodules=none "$BASE_SHA" "$MERGE_SHA" -- ':(top,literal,exclude)README.md'
          )
          # README.md is prose. The Go package, fixture and generated Grafana checks do not read it.
          if readme_only; then
            echo "build-test=readme-only" >> "$GITHUB_OUTPUT"
            echo "Only the ordinary README.md blob changed in the pull request and tested merge."
          else
            echo "build-test=full" >> "$GITHUB_OUTPUT"
            echo "The complete Go gate is required."
          fi

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0
    with:
      enforce: true

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test, groma-check, lint, govulncheck, goreleaser-snapshot, docker-build, privacy-sweep, backlog-freeze, zizmor]
    steps:
      - name: Require each gate or its explicit skip
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          BUILD_TEST_PATHS: ${{ needs.backlog-freeze.outputs.build-test }}
          GROMA_CHECK: ${{ needs.groma-check.result }}
          LINT: ${{ needs.lint.result }}
          GOVULNCHECK: ${{ needs.govulncheck.result }}
          GORELEASER_SNAPSHOT: ${{ needs.goreleaser-snapshot.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
          ZIZMOR: ${{ needs.zizmor.result }}
        run: |
          require_result() {
            if [[ "$2" != "$3" ]]; then
              echo "$1 was '$2', expected '$3'" >&2
              exit 1
            fi
          }
          build_expected=success
          pr_expected=skipped
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            pr_expected=success
            require_result backlog-freeze "$BACKLOG_FREEZE" success
            case "$BUILD_TEST_PATHS" in
              readme-only) build_expected=skipped ;;
              full) ;;
              *) echo "The Go gate path decision is missing or invalid" >&2; exit 1 ;;
            esac
          fi
          require_result build-test "$BUILD_TEST" "$build_expected"
          require_result groma-check "$GROMA_CHECK" success
          require_result lint "$LINT" success
          require_result govulncheck "$GOVULNCHECK" success
          require_result goreleaser-snapshot "$GORELEASER_SNAPSHOT" success
          require_result docker-build "$DOCKER_BUILD" success
          require_result privacy-sweep "$PRIVACY_SWEEP" "$pr_expected"
          require_result backlog-freeze "$BACKLOG_FREEZE" "$pr_expected"
          require_result zizmor "$ZIZMOR" success
