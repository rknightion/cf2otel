version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # GenAI names containing "tokens" are protocol constants, not credentials.
      - path: internal/semconv/genai\.go
        linters: [gosec]
        text: 'G101:'
      - path: _test\.go
        linters: [bodyclose, errcheck, gosec]
formatters:
  enable: [gofmt, goimports]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
